<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CraftNetwork</title>
<style>
:root{--bg:#18181b;--bg2:#0b0b0d;--card:#1c1c1f;--card2:#222226;--bd:#2a2a2e;--g:#2ecc71;--tx:#f4f4f5;--mu:#8e8e96;--r:#e5534b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif;font-size:15px;padding-bottom:84px;line-height:1.4}
h2,h3{margin:.2em 0 .4em;font-weight:700}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:10px 16px;background:var(--g);color:#06210f;font-weight:700;box-shadow:0 6px 18px #2ecc7122;transition:transform .1s,filter .15s}
button:active{transform:scale(.97)}button:hover{filter:brightness(1.07)}
button.s{background:var(--card2);color:var(--g);border:1px solid var(--bd);box-shadow:none}
button.d{background:var(--r);color:#fff;box-shadow:none}button.y{background:#f5c518;color:#2a2000;box-shadow:none}
button:disabled{background:#444;color:#888;box-shadow:none}
input,textarea{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;color:var(--tx);font:inherit;font-size:15px;margin:5px 0 11px;outline:0}
input::placeholder,textarea::placeholder{color:#6a6a72}input:focus,textarea:focus{border-color:var(--g)}
.fbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px solid var(--bd);color:var(--g);border-radius:14px;padding:9px;margin:5px 0 10px;cursor:pointer;font-weight:600}
.fbtn.ok{border-color:var(--g)}.fbtn{position:relative;overflow:hidden}.fbtn input{display:block;position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer}
label{color:var(--mu);font-size:14px}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--bg)}
.lg{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--g);font-weight:600;font-size:18px;white-space:nowrap}
.lb{flex:none;width:42px;height:42px;border-radius:14px;background:#1e2b24;border:1px solid #1f6b43;display:flex;align-items:center;justify-content:center}.lb .ic{width:26px;height:26px}
.top .ib{flex:none;width:42px;height:42px;padding:0;border-radius:16px;background:var(--card2);color:var(--tx);box-shadow:none;display:flex;align-items:center;justify-content:center;position:relative}
.top .ib .dot{position:absolute;top:-4px;right:-4px}
.pill{flex:none;max-width:42%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;display:inline-flex;align-items:center;gap:10px;background:var(--card2)!important;color:var(--tx)!important;border:1px solid var(--bd);border-radius:999px!important;padding:6px 14px 6px 6px!important;box-shadow:none!important;font-weight:500!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:14px;margin:10px 12px;position:relative}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mu{color:var(--mu);font-size:13px}.g{color:var(--g)}.c{text-align:center}
.av{width:44px;height:44px;border-radius:50%;background:#2a2a2e center/cover;flex:none;border:2px solid #1f6b43;display:flex;align-items:center;justify-content:center;color:#55555d;overflow:hidden}
.av.sm{width:34px;height:34px}.av.b{width:96px;height:96px;margin:-48px auto 6px;border:5px solid var(--card);background-color:#18181b}.av.b .ic{width:54px;height:54px}
.ban{height:110px;background:#28282b center/cover}
.pbtn{position:absolute;top:16px;right:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stats div{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:10px 4px;text-align:center;font-size:11px;letter-spacing:.06em;color:var(--mu)}
.stats b{display:block;font-size:22px;font-weight:500;color:var(--g);letter-spacing:0;margin-bottom:2px}
.srow{display:flex;justify-content:space-between;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:10px 16px;color:var(--mu);font-size:14px}
.pdiv{border:0;border-top:1px solid var(--bd);margin:12px 6px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101012;border-top:1px solid var(--bd);padding:4px 0 8px;z-index:5}
.nav a{flex:1;text-align:center;font-size:12px;color:var(--mu);cursor:pointer}
.nav a i{font-style:normal;display:flex;align-items:center;justify-content:center;height:26px}.nav a.on{color:var(--g)}
.nav a.mid i{background:var(--g);border-radius:22px;width:56px;height:56px;margin:-22px auto 2px;color:#06210f;box-shadow:0 0 0 4px #101012,0 4px 22px #2ecc7144}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em}.nav a i .ic{width:22px;height:22px}.nav a.mid i .ic{width:26px;height:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;cursor:pointer;border:1px solid var(--bd)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}#modal.on{display:flex}
.mb{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:16px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
.mb hr{border:0;border-top:1px solid var(--bd)}.mb button:not(.sp){margin-top:4px}
.msg{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 11px;margin:5px 12px;max-width:80%;font-size:14px;line-height:1.3;width:fit-content}
.msg.me{margin-left:auto;background:#1b2a22;border-color:#1f6b43}.msg.ment{background:#fff;color:#16181b;border-color:#fff}
.msg .q{border-left:3px solid var(--g);padding-left:8px;font-size:12px;opacity:.75;margin-bottom:4px}
.tabs{display:flex;gap:6px;margin:14px}.tabs button{flex:1}.dot{background:var(--r);border-radius:10px;font-size:11px;padding:1px 6px;color:#fff}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--g);padding:11px 18px;border-radius:999px;z-index:30;display:none;max-width:90%;font-size:14px}
.pn{max-width:90px;overflow:hidden;text-overflow:ellipsis}.pill{max-width:none!important;overflow:visible!important}
@media(max-width:440px){.lg{font-size:15px;gap:8px}.lb{width:38px;height:38px}.top .ib{width:38px;height:38px}.pn{max-width:56px}}
@media(max-width:370px){.pn{display:none}.pill{padding:5px 12px 5px 5px!important}}
.hero{margin:12px;padding:22px 16px 18px;text-align:center;border:1px solid var(--bd);border-radius:32px;background:linear-gradient(180deg,#121214,#0a0a0b)}
.hero h2{color:var(--g);font-size:26px;line-height:1.15;font-weight:800;letter-spacing:.02em;margin:4px 0 16px}
.ipbox{display:inline-flex;align-items:center;gap:10px;max-width:100%;border:1px solid var(--bd);background:#0b0b0d;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.ipbox i{width:1px;height:20px;background:var(--bd)}.ipbox b{color:var(--g);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.hero p{color:#b4b4bb;margin:16px 6px 0;line-height:1.6;font-size:14.5px}
.rules{border-radius:32px;padding:18px 18px 8px}.rt{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--tx);padding-bottom:12px;border-bottom:1px solid var(--bd);margin-bottom:10px}.rt .ic{color:var(--g);width:22px;height:22px}
.rl{display:flex;gap:14px;align-items:flex-start;padding:8px 0;color:#c4c4ca;line-height:1.35}
.num{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #1f6b43;background:#17261d;color:var(--g);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.fpanel{border-color:#1f6b43;border-radius:32px;padding:18px}.ft{display:flex;align-items:center;gap:10px;color:var(--g);font-weight:700;font-size:15px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb.post{padding:0;overflow:auto;border-radius:28px}.pimg{width:100%;display:block;max-height:65vh;object-fit:cover}
.fab{position:absolute;top:12px;width:38px;height:38px;padding:0;border-radius:50%;background:#000a;color:#fff;box-shadow:none;display:flex;align-items:center;justify-content:center}
#pmenu{display:none;position:absolute;top:56px;right:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;z-index:2}#pmenu.on{display:block}
#pmenu a{display:flex;gap:8px;align-items:center;padding:12px 16px;cursor:pointer;white-space:nowrap}#pmenu a:first-child{color:var(--r);border-bottom:1px solid var(--bd)}
.pbody{padding:16px}.pn2{font-weight:700;font-size:18px}.pd{color:var(--mu);font-size:16px;margin-top:6px}
.lk{background:none;box-shadow:none;color:var(--tx);padding:0;display:flex;gap:8px;align-items:center;font-size:18px;font-weight:500}.lk .ic{width:26px;height:26px}.lk.on{color:var(--r)}.lk.on svg{fill:currentColor}
.cm{padding:8px 0 0;font-size:14px;color:#c4c4ca}.cm b{color:var(--tx)}.sq{width:48px;height:46px;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.th{background:var(--card2);border:1px solid var(--bd);border-radius:18px;overflow:hidden;min-width:0}
.grid .th img{border:0;border-radius:0;display:block}
.tf{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;color:var(--mu);background:#2a2b30}
.tl{display:flex;align-items:center;gap:4px;flex:none}.tl .ic{width:14px;height:14px}.tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;color:var(--tx);font-weight:500}
.ts{flex:none;color:var(--g);cursor:pointer;display:flex}.ts .ic{width:16px;height:16px}
.chatbar{position:fixed;left:0;right:0;bottom:var(--navh,60px);background:var(--bg);padding:8px 12px 28px;z-index:4;border-top:1px solid var(--bd)}
.grid img.pimgs{aspect-ratio:1;object-fit:cover;border-radius:18px;border:1px solid var(--bd)}
.cb{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--card2);color:var(--g);border:1px solid var(--bd);cursor:pointer}.cb input{position:absolute;inset:0;opacity:0;margin:0;padding:0;width:100%;height:100%;border:0}
.gc{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;height:130px;display:flex;flex-direction:column;cursor:pointer;min-width:0}.gb{height:50%;background:#28282b center/cover}.gt{height:50%;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0}.gt b,.gt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.gt span{font-size:11px;color:var(--mu)}
.fl{display:flex;gap:14px;overflow-x:auto;padding:12px 2px 4px}.fi{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer}.fi b,.fi span{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fi b{font-size:13px}.fi span{font-size:11px;color:var(--mu)}.av.f{width:64px;height:64px;margin-bottom:4px}
.stk{width:120px;height:120px;object-fit:contain;display:block}.stk{width:auto;height:auto;max-width:150px;max-height:150px;border-radius:22px;cursor:pointer;margin-top:2px}.msg.stkm,.msg.stkm.me,.msg.stkm.ment{background:none;border:0;padding:0}.stkm .tm,.stkm .rpl{display:none}.mi{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:4px 0;cursor:pointer}
.gcr{display:flex;justify-content:center;gap:6px;margin-top:8px}.gcir{width:30px;height:30px;border-radius:50%;background:#28282b center/cover;border:2px solid #1f6b43;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--g);cursor:pointer}
.cm2{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.cm2 .ct{color:#c4c4ca;word-break:break-word}.cm2 b{color:var(--tx)}
.pcard{width:210px;max-width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin:4px 0;cursor:pointer}.pcard img{width:100%;height:150px;object-fit:cover;display:block}.pcb{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px;color:var(--mu)}.pcb b{color:var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pcd{padding:0 10px 8px;font-size:13px;color:#c4c4ca}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
/* ===== CAPA DE DATOS =====
 Ahora guarda en localStorage (solo sirve en UN dispositivo).
 Para multiusuario real, reemplaza load() y save() por llamadas a tu base de datos
 (Firebase / Supabase). Todo el estado vive en el objeto S. */
const KEY='cn_db';
const def=()=>({users:[{id:'u0',nick:'UnaRata',mc:'UnaRata_MC',pass:'',founder:1,av:'',ban:''}],reqs:[],notes:[],photos:[],msgs:[],
 server:{name:'SURVIVAL ZOMBIE HARDCORE',ip:'play.craftnetwork.net',port:'25565',desc:'El mejor servidor Survival semi-vanilla con economía, protección de terrenos y eventos semanales.',rules:'Respetar a todos los miembros del servidor.\nProhibido el uso de hacks, clientes modificados o x-ray.\nNo destruir construcciones ajenas (Griefing no permitido).\nMantener el chat limpio de spam o enlaces sospechosos.',mod:Date.now()},spam:{}});
let S;function load(){try{S=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){S=def()}['stk','groups','cm','fr','frq','ginv'].forEach(k=>S[k]=S[k]||[])}
function save(){window.cloudPush&&window.cloudPush();localStorage.setItem(KEY,JSON.stringify(S))}
load();save();
const ICONS={'dots':'<circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/>','shield':'<path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z" fill="currentColor"/>','edit':'<path d="M11 5H5v14h14v-6"/><path d="M18 3l3 3-9 9H9v-3z"/>','copy':'<rect x="8" y="8" width="12" height="12" rx="2" fill="currentColor"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>','cube':'<path d="M12 3l8 4.500v9L12 21l-8-4.500v-9z"/><path d="M4 7.500l8 4.500 8-4.500M12 12v9"/>','chat': '<path d="M4 5h16v11H9l-5 4z"/>', 'image': '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/>', 'server': '<rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/>', 'users': '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M16 14c3 0 5 2 5 5"/>', 'user': '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>', 'bell': '<path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/>', 'logout': '<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>', 'gear': '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>', 'crown': '<path d="M4 18h16M4 18L3 7l5 4 4-6 4 6 5-4-1 11z" fill="#f5c518" stroke="#f5c518"/>', 'clock': '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 'mail': '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', 'check': '<path d="M4 12l5 5 11-11"/>', 'x': '<path d="M6 6l12 12M18 6L6 18"/>', 'key': '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>', 'cookie': '<circle cx="12" cy="12" r="9"/><path d="M9 9h.01M14 8h.01M10 14h.01M15 14h.01"/>', 'trash': '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', 'heart': '<path d="M12 20S4 14.5 4 9a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 5.500-8 11-8 11z"/>', 'send': '<path d="M3 11L21 3l-8 18-2-8z"/>', 'refresh': '<path d="M20 12a8 8 0 10-3 6.200M20 5v5h-5"/>', 'reply': '<path d="M10 7L4 12l6 5M4 12h10a6 6 0 016 6"/>', 'mute': '<path d="M4 9v6h4l5 4V5L8 9zM17 9l4 6M21 9l-4 6"/>', 'warn': '<path d="M12 3L2 20h20zM12 10v4M12 17h.01"/>', 'back': '<path d="M19 12H5M11 6l-6 6 6 6"/>','smile':'<circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 7 2 8 0M9 9h.01M15 9h.01"/>','plus':'<path d="M12 5v14M5 12h14"/>'};
const I=h=>String(h).replace(/\{\{(\w+)\}\}/g,(_,n)=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const me=()=>S.users.find(u=>u.id==localStorage.getItem('cn_me'));
const usr=id=>S.users.find(u=>u.id==id)||{nick:'(eliminado)',mc:'',av:''};
let view='chat',pv=null,rsel=null,toastT;
function toast(t){const e=$('toast');e.textContent=t.replace(/\{\{\w+\}\}\s*/g,'');e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3500)}
function modal(h,c=''){$('modal').innerHTML=I('<div class="mb '+c+'">'+h+'</div>');$('modal').className='on'}
function closeM(){$('modal').className=''}
function confirm2(t,fn){window._fn=fn;modal(`<p>${t}</p><div class="row"><button class="s sp" onclick="closeM()">Cancelar</button><button class="d sp" onclick="modal('<p>¿Seguro? Esta acción no se puede deshacer.</p><div class=row><button class=s onclick=closeM()>No</button><button class=d onclick=closeM();_fn()>Sí, borrar</button></div>')">Sí</button></div>`)}
function img(file,max,cb,png){if(!file)return;const u=URL.createObjectURL(file),i=new Image();
i.onload=()=>{try{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.75))}catch(e){toast('No se pudo procesar la imagen.')}};
i.onerror=()=>{URL.revokeObjectURL(u);toast('No se pudo leer esa imagen. Prueba con una JPG o PNG.')};i.src=u}
const bg=u=>u?`style="background-image:url(${u})"`:'';
const thumb=p=>`<div class="th"><img src="${p.src}" onclick="post('${p.id}')"><div class="tf"><span class="tn">${esc(usr(p.by).nick)}</span><span class="tl">{{heart}} ${p.likes.length}</span><span class="ts" onclick="sendPh('${p.id}')">{{send}}</span></div></div>`;
const avh=(u,c='')=>`<div class="av ${c}" ${bg(u.av)}>${u.av?'':'{{user}}'}</div>`;

/* ===== COOKIES ===== */
function cookies(){if(document.cookie.includes('cn_ok=1')||localStorage.getItem('cn_ok'))return false;
modal(`<h3>{{cookie}} Cookies obligatorias</h3><p class="mu">Las usamos para guardar tu sesión: cuando aceptas, el sitio te reconoce al volver a entrar sin pedirte datos de nuevo. Sin ellas no puedes usar CraftNetwork.</p><button style="width:100%" onclick="document.cookie='cn_ok=1;max-age=31536000;path=/';localStorage.setItem('cn_ok','1');closeM();render()">Aceptar y continuar</button>`);return true}

/* ===== AUTH ===== */
function authView(){const rid=localStorage.getItem('cn_req');
return `<div class="top"><div class="lg"><span class="lb">{{cube}}</span>CraftNetwork</div></div><div class="card c"><h2>Iniciar Sesión</h2><p class="mu">Ingresa a la comunidad de CraftNetwork</p>
<div style="text-align:left"><label>Usuario</label><input id="lu"><label>Contraseña</label><input id="lp" type="password"></div>
<div class="row"><button class="sp" onclick="login()">Entrar al Servidor</button>${rid?'<button class="y" onclick="clock()">{{clock}}</button>':''}</div>
<hr style="border-color:var(--bd);margin:18px 0"><p class="mu">¿Aún no eres miembro?</p><button class="s" style="width:100%" onclick="view='reg';render()">SOLICITAR REGISTRO</button></div>`}
function regView(){return `<div class="top"><div class="lg"><span class="lb">{{cube}}</span>CraftNetwork</div></div><div class="card"><h2 class="c">Solicitar Registro</h2><p class="g mu">Nota: el nombre y tu nick de Minecraft los puedes cambiar después.</p>
<label>Nombre de Usuario (Nickname)</label><input id="rn"><label>Nombre en Minecraft (IGN)</label><input id="rm" placeholder="Ej: RataCraft99">
<label>¿Quién eres? (para que el fundador te acepte)</label><textarea id="rd" rows="3"></textarea>
<label>Contraseña</label><input id="r1" type="password"><label>Repetir Contraseña</label><input id="r2" type="password">
<button style="width:100%" onclick="reg()">Enviar Solicitud</button><p class="c mu" onclick="view='auth';render()" style="cursor:pointer">{{back}} Volver a Iniciar Sesión</p></div>`}
function reg(){const n=$('rn').value.trim(),m=$('rm').value.trim(),d=$('rd').value.trim(),a=$('r1').value,b=$('r2').value;
if(!n||!m||!d||!a)return toast('Completa todos los campos.');if(a!==b)return toast('Las contraseñas no coinciden.');
if(S.users.some(u=>u.nick.toLowerCase()==n.toLowerCase())||S.reqs.some(r=>r.status=='pending'&&r.nick.toLowerCase()==n.toLowerCase()))return toast('Ese nickname ya está en uso.');
const r={id:uid(),nick:n,mc:m,pass:a,desc:d,status:'pending'};S.reqs.push(r);
S.notes.push({id:uid(),to:'u0',ico:'{{mail}}',text:'Solicitud de '+n,kind:'req',ref:r.id,ts:Date.now()});save();
localStorage.setItem('cn_req',r.id);view='auth';render();modal('<h3>{{check}} Solicitud enviada</h3><p>Tu cuenta fue enviada al fundador. Toca el botón amarillo {{clock}} para ver el estado.</p><button onclick="closeM()">Entendido</button>')}
function clock(){load();const r=S.reqs.find(x=>x.id==localStorage.getItem('cn_req'));
if(!r){localStorage.removeItem('cn_req');render();return}
if(r.status=='pending')return modal('<h3>{{clock}} En espera</h3><p>El fundador aún no revisa tu solicitud.</p><button onclick="closeM()">Cerrar</button>');
if(r.status=='rejected')return modal('<h3>{{x}} Rechazada</h3><p>Tu solicitud fue rechazada.</p><button onclick="localStorage.removeItem(\'cn_req\');closeM();render()">Cerrar</button>');
modal(`<h3>{{check}} ¡Aceptado!</h3><p>Usuario: <b>${esc(r.nick)}</b><br>Contraseña: <b>${esc(r.pass)}</b></p><button onclick="localStorage.removeItem('cn_req');closeM();render()">Entendido</button>`)}
function login(){load();const u=S.users.find(x=>x.nick.toLowerCase()==$('lu').value.trim().toLowerCase()&&x.pass==$('lp').value);
if(!u)return toast('Usuario o contraseña incorrectos.');localStorage.setItem('cn_me',u.id);view='profile';pv=null;render()}
function logout(){room=null;tab='gen';localStorage.removeItem('cn_me');view='auth';render()}

/* ===== NOTIFICACIONES ===== */
function bell(){const m=me(),l=S.notes.filter(n=>n.to==m.id).sort((a,b)=>b.ts-a.ts);
modal(`<h3>{{bell}} Notificaciones</h3>${l.map(n=>`<div class="card" style="margin:8px 0;padding:12px;cursor:pointer" onclick="${n.kind=='req'?`reqOpen('${n.ref}')`:n.kind=='stk'?`stkOpen('${n.ref}')`:n.kind=='fr'?`frOpen('${n.ref}')`:n.kind=='gi'?`ginvOpen('${n.ref}')`:`ndel('${n.id}')`}">${n.ico} ${esc(n.text)}</div>`).join('')||'<p class="mu">Nada nuevo.</p>'}<button class="s" onclick="closeM()">Cerrar</button>`)}
function reqOpen(id){const r=S.reqs.find(x=>x.id==id);if(!r)return;
modal(`<h3>Solicitud de ${esc(r.nick)}</h3><p>Minecraft: <b>${esc(r.mc)}</b></p><p class="mu">${esc(r.desc)}</p>${r.status=='pending'?`<div class="row"><button class="d sp" onclick="reqAns('${id}',0)">Rechazar</button><button class="sp" onclick="reqAns('${id}',1)">Aceptar</button></div>`:'<p class="g">Ya respondida: '+r.status+'</p>'}`)}
function reqAns(id,ok){const r=S.reqs.find(x=>x.id==id);r.status=ok?'accepted':'rejected';
if(ok){S.users.push({id:uid(),nick:r.nick,mc:r.mc,pass:r.pass,av:'',ban:'',au:r.au,em:r.em});window.cloudApprove&&cloudApprove(r)}
S.notes=S.notes.filter(n=>n.ref!=id);save();closeM();toast(ok?'Cuenta aceptada.':'Solicitud rechazada.');render()}

const rec=ph.reduce((a,p)=>a+p.likes.length,0),giv=S.photos.reduce((a,p)=>a+(p.likes.includes(u.id)?1:0),0);
return `<div class="card" style="padding:0;overflow:hidden"><div class="ban" ${bg(u.ban)}></div>${own?'<button class="s pbtn" onclick="settings()">{{gear}} Ajustes</button>':''}
<div class="c" style="padding:0 14px 14px">${avh(u,'b')}<h2 style="margin:0;font-size:22px">${esc(u.nick)} ${u.founder?'{{crown}}':''}</h2><div class="g" style="margin-top:4px">${esc(u.mc)}</div>${own?'':commonV(u)}<hr class="pdiv">
${u.desc?`<div style="margin:0 6px;color:#c4c4ca;white-space:pre-wrap;word-break:break-word">${esc(u.desc)}</div>`:''}
<div class="stats"><div><b>${ph.length}</b>FOTOS</div><div><b style="color:#e5534b">${giv}</b>LIKES DADOS</div><div><b style="color:#f5c518">${rec}</b>LIKES RECIBIDOS</div></div>
<div class="srow"><span>${own?'Mi Sticker Activo:':'Sticker:'}</span><span>${stkShow(u)}</span></div>${own?'':frBtn(u)+cfV(u)}</div></div>
<div class="card"><b>Fotos</b><div class="grid" style="margin-top:12px">${ph.map(p=>`<img class="pimgs" src="${p.src}" onclick="post('${p.id}')">`).join('')||'<p class="mu">Sin fotos.</p>'}</div></div>`}
function settings(){const m=me();
modal(`<h3>Ajustes</h3><label class="fbtn">{{image}} Elegir foto<input type="file" accept="image/*" onchange="img(this.files[0],200,d=>{me().av=d;save();render();closeM()})"></label>
<label class="fbtn">{{image}} Elegir banner<input type="file" accept="image/*" onchange="img(this.files[0],700,d=>{me().ban=d;save();render();closeM()})"></label>
<label>Nickname</label><input id="sn" value="${esc(m.nick)}"><label>Nombre de Minecraft</label><input id="sm" value="${esc(m.mc)}"><label>Descripción</label><textarea id="sd" rows="3" maxlength="200" placeholder="Cuéntanos algo sobre ti...">${esc(m.desc||'')}</textarea><button onclick="saveS()">Guardar datos</button>
<hr style="border-color:var(--bd)"><b>Cambiar contraseña</b><input id="p0" type="password" placeholder="Contraseña actual"><input id="p1" type="password" placeholder="Nueva contraseña"><input id="p2" type="password" placeholder="Repetir nueva"><button onclick="chPass()">Cambiar contraseña</button>
<button class="s" style="width:100%;margin-top:12px" onclick="stkMenu()">{{image}} Mi sticker</button><hr style="border-color:var(--bd);margin:14px 0"><div class="row"><button class="d sp" onclick="delFiles()">Borrar archivos</button>${m.founder?'':'<button class="d sp" onclick="delAcc()">Borrar cuenta</button>'}</div>
${m.founder?'<button class="s" style="width:100%;margin-top:12px" onclick="passes()">{{key}} Ver contraseñas de todos</button>':''}<button class="s" style="width:100%;margin-top:12px" onclick="closeM()">Cerrar</button>`)}
function saveS(){const n=$('sn').value.trim(),m=me();if(!n)return;if(S.users.some(u=>u.id!=m.id&&u.nick.toLowerCase()==n.toLowerCase()))return toast('Nickname en uso.');m.nick=n;m.mc=$('sm').value.trim();m.desc=$('sd').value.trim();save();closeM();render()}
function chPass(){const m=me();if($('p0').value!==m.pass)return toast('La contraseña actual es incorrecta.');if(!$('p1').value||$('p1').value!==$('p2').value)return toast('Las nuevas no coinciden.');m.pass=$('p1').value;save();closeM();toast('Contraseña cambiada.')}
function delFiles(){confirm2('¿Borrar tus fotos y mensajes?',()=>{const m=me();S.photos=S.photos.filter(p=>p.by!=m.id);S.msgs=S.msgs.filter(x=>x.by!=m.id);S.cm=S.cm.filter(x=>x.by!=m.id);save();render()})}
function purge(id){S.photos=S.photos.filter(p=>p.by!=id);S.msgs=S.msgs.filter(x=>x.by!=id);S.users=S.users.filter(u=>u.id!=id);S.notes=S.notes.filter(n=>n.to!=id);S.stk=S.stk.filter(k=>k.by!=id);S.fr=S.fr.filter(p=>!p.includes(id));S.groups.forEach(g=>g.mem=g.mem.filter(i=>i!=id));S.groups=S.groups.filter(g=>g.owner!=id);S.cm=S.cm.filter(x=>x.by!=id&&(x.room[0]=='f'||S.groups.some(g=>'g:'+g.id==x.room)));S.ginv=S.ginv.filter(i=>i.from!=id&&i.to!=id)}
function delAcc(){confirm2('¿Borrar tu cuenta para siempre?',()=>{purge(me().id);save();logout()})}
function passes(){modal(`<h3>{{key}} Contraseñas</h3>${S.users.map(u=>`<p><b>${esc(u.nick)}</b>: ${u.pass?esc(u.pass):'(protegida)'}</p>`).join('')}<button class="s" onclick="closeM()">Cerrar</button>`)}

let ctab='all';

const l=frs(me().id).map(usr);
return `<div class="tabs">${t}</div>`+(ctab=='all'?commAll():l.map(u=>`<div class="card row" style="margin:10px 14px;padding:12px;cursor:pointer" onclick="view='profile';pv='${u.id}';render()">${avh(u)}<div class="sp"><b>${esc(u.nick)}</b> ${u.founder?'{{crown}}':''}<div class="mu">${esc(u.mc)}</div></div></div>`).join('')||'<p class="c mu">Aún no has agregado amigos.</p>')}

function server(){const s=S.server,m=me(),ip=esc(s.ip)+':'+esc(s.port);
return `<div class="hero"><h2>${esc(s.name)}</h2><div class="ipbox"><span>${ip}</span><i></i><b onclick="navigator.clipboard&&navigator.clipboard.writeText('${ip}');toast('Copiado')">{{copy}} Copiar</b></div><p>${esc(s.desc)}</p></div>
<div class="card rules"><div class="rt">{{shield}} Normas del Servidor</div>${s.rules.split('\n').filter(x=>x.trim()).map((r,i)=>`<div class="rl"><span class="num">${i+1}</span><span>${esc(r)}</span></div>`).join('')}</div>
${m.founder?`<div class="card fpanel"><div class="ft">{{edit}} PANEL DEL SERVIDOR (FUNDADOR)</div><label>Nombre</label><input id="s1" value="${esc(s.name)}"><div class="two"><div><label>IP</label><input id="s2" value="${esc(s.ip)}"></div><div><label>Puerto</label><input id="s3" value="${esc(s.port)}"></div></div><label>Descripción</label><textarea id="s4" rows="2">${esc(s.desc)}</textarea><label>Reglas (por línea)</label><textarea id="s5" rows="4">${esc(s.rules)}</textarea><button style="width:100%;border-radius:999px" onclick="saveSrv()">Guardar Cambios</button></div>`:''}
<p class="c mu" style="margin:6px 0 16px">Última modificación: ${new Date(s.mod).toLocaleString()}</p>`}

/* ===== ÁLBUM ===== */
let pic=null;
function album(){return `<div class="card"><b class="g">Compartir Captura / Foto</b><input id="ad" placeholder="Escribe una descripción..." style="margin-top:10px"><div class="row"><label class="fbtn sp${pic?' ok':''}" id="afl" style="margin:0">{{image}} <span>${pic?'Foto lista':'Elegir foto'}</span><input type="file" id="af" accept="image/*" onchange="img(this.files[0],900,d=>{pic=d;$('afl').classList.add('ok');$('afl').querySelector('span').textContent='Foto lista';toast('Foto lista. Escribe una descripción y toca Subir.')})"></label><button onclick="upl()">Subir</button></div></div>
<div class="grid" style="margin:14px">${S.photos.slice().reverse().map(thumb).join('')||'<p class="mu">No hay fotos en el álbum todavía.</p>'}</div>`}
function upl(){if(!pic)return toast('Elige una imagen primero.');S.photos.push({id:uid(),by:me().id,src:pic,desc:$('ad').value,likes:[],com:[],ts:Date.now()});pic=null;try{save()}catch(e){S.photos.pop();return toast('Sin espacio. Con una base de datos real esto no pasa.')}render()}
function post(id){const p=S.photos.find(x=>x.id==id);if(!p)return closeM();const m=me(),u=usr(p.by),old=$('modal').firstChild,st=old?old.scrollTop:0,liked=p.likes.includes(m.id);
modal(`<div style="position:relative"><img class="pimg" src="${p.src}"><button class="fab" style="left:12px" onclick="closeM()">{{x}}</button>${p.by==m.id||m.founder?`<button class="fab" style="right:12px" onclick="$('pmenu').classList.toggle('on')">{{dots}}</button><div id="pmenu"><a onclick="confirm2('¿Borrar esta foto?',()=>{S.photos=S.photos.filter(x=>x.id!='${id}');save();render()})">{{trash}} Borrar foto</a><a onclick="sendPh('${id}')">{{send}} Enviar a un amigo</a></div>`:''}</div>
<div class="pbody"><div class="pn2">${esc(u.nick)}</div>${p.desc?`<div class="pd">${esc(p.desc)}</div>`:''}<hr class="pdiv" style="margin:14px 0">
<div class="row"><button class="lk ${liked?'on':''}" onclick="like('${id}')">{{heart}} ${p.likes.length}</button><span class="sp"></span><span class="mu" style="font-size:15px">${p.com.length} comentarios</span></div>
${p.com.map(c=>`<div class="cm cm2">${avh(usr(c.by),'sm')}<div><b>${esc(usr(c.by).nick)}</b><div class="ct">${esc(c.t)}</div></div></div>`).join('')}
<div class="row" style="margin-top:14px"><input id="cm" placeholder="Comentar..." style="margin:0" onkeydown="if(event.key=='Enter')comment('${id}')"><button class="s sq" onclick="comment('${id}')">{{send}}</button></div></div>`,'post');
if(st)$('modal').firstChild.scrollTop=st}
function like(id){const p=S.photos.find(x=>x.id==id),m=me().id,i=p.likes.indexOf(m);i<0?p.likes.push(m):p.likes.splice(i,1);save();post(id);render()}
function comment(id){const t=$('cm').value.trim();if(!t)return;S.photos.find(x=>x.id==id).com.push({by:me().id,t});save();post(id)}

/* ===== CHAT: GENERAL / GRUPAL / AMIGOS ===== */
let rep=null,tab='gen',room=null,gban=null,spic=null;
const rkey=(a,b)=>'f:'+[a,b].sort().join('_');
const isFr=(a,b)=>S.fr.some(p=>p.includes(a)&&p.includes(b));
const frs=id=>S.fr.filter(p=>p.includes(id)).map(p=>p.find(x=>x!=id)).filter(x=>S.users.some(u=>u.id==x));
const mine=()=>S.groups.filter(g=>g.mem.includes(me().id));
const gm=r=>r=='gen'?S.msgs:S.cm.filter(x=>x.room==r);
const ttl={gen:'4 Horas',g:'1 Día',f:'1 Semana'};
const mst=u=>S.stk.find(k=>k.by==u.id);
function setTab(t){tab=t;room=null;rep=null;render()}
function openR(r){room=r;rep=null;render();window.scrollTo(0,document.body.scrollHeight)}
function setRep(id){const d=$('ct')?$('ct').value:'';rep=id;render();if($('ct')){$('ct').value=d;$('ct').focus()}}
function zoom(s){modal(`<img src="${s}" style="width:100%;border-radius:16px"><button class="s" style="width:100%;margin-top:8px" onclick="closeM()">Cerrar</button>`)}
function chat(){const tb=[['gen','General'],['grp','Grupal'],['fr','Amigos']].map(([k,l])=>`<button class="${tab==k?'':'s'}" onclick="setTab('${k}')">${l}</button>`).join('');
const r=tab=='gen'?'gen':room;return `<div class="tabs">${tb}</div>`+(r?roomV(r):tab=='grp'?groupsV():friendsV())}
function postC(id){const p=S.photos.find(x=>x.id==id);return p?`<div class="pcard" onclick="post('${id}')"><img src="${p.src}"><div class="pcb"><b>${esc(usr(p.by).nick)}</b><span>{{heart}} ${p.likes.length}</span></div>${p.desc?`<div class="pcd">${esc(p.desc)}</div>`:''}</div>`:'<div class="mu">[post eliminado]</div>'}
function msgH(x,m,ok){const u=usr(x.by),q=x.rep&&[...S.msgs,...S.cm].find(y=>y.id==x.rep),s=x.stk&&S.stk.find(k=>k.id==x.stk),
ment=ok&&x.by!=m.id&&(x.t||'').toLowerCase().includes('@'+m.nick.toLowerCase());
return `<div class="msg ${x.by==m.id?'me':''} ${ment?'ment':''} ${s||x.stk?'stkm':''}">${q?`<div class="q">${esc(usr(q.by).nick)}: ${esc(q.stk?'[sticker]':q.t?q.t.slice(0,60):q.post?'[post]':'[foto]')}</div>`:''}<b class="g" style="${ment?'color:#0a7a3a':''}">${esc(u.nick)}</b> <span class="mu tm">${new Date(x.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>${s?`<img class="stk" src="${s.src}" onclick="setRep('${x.id}')">`:x.stk?'<div class="mu">[sticker eliminado]</div>':''}${x.img?`<img class="mi" src="${x.img}" onclick="zoom(this.src)">`:''}${x.post?postC(x.post):''}${x.t?`<div>${esc(x.t)}</div>`:''}<span class="mu rpl" style="cursor:pointer" onclick="setRep('${x.id}')">{{reply}} Responder</span>${m.founder?` <span style="cursor:pointer" onclick="confirm2('¿Borrar mensaje?',()=>{S.msgs=S.msgs.filter(y=>y.id!='${x.id}');S.cm=S.cm.filter(y=>y.id!='${x.id}');save();render()})">{{trash}}</span>`:''}</div>`}
function roomV(r){const m=me(),t=r=='gen'?'gen':r[0],g=t=='g'&&S.groups.find(x=>x.id==r.slice(2)),fu=t=='f'&&usr(r.slice(2).split('_').find(x=>x!=m.id));
if(t=='g'&&!g){room=null;return groupsV()}
const head=t=='gen'?'':`<div class="card row" style="padding:10px;margin:0 14px 4px"><button class="s sq" onclick="room=null;rep=null;render()">{{back}}</button>${fu?avh(fu,'sm'):''}${g?`<div class="gcir" style="width:34px;height:34px;flex:none" ${bg(g.ban)}>${g.ban?'':esc(g.name[0])}</div>`:''}<div class="sp"><b>${esc(g?g.name:fu.nick)}</b><div class="mu">${g?g.mem.length+' personas':esc(fu.mc)}</div></div>${g?`<button class="s" onclick="ginfo('${g.id}')">Info</button>`:''}</div>`;
const rq=rep&&[...S.msgs,...S.cm].find(y=>y.id==rep);
return head+`<div class="card row" style="padding:10px;margin:4px 14px"><span class="g">{{refresh}} Auto-eliminación:</span> <b>${ttl[t]}</b></div>
<div id="msgs" style="min-height:50vh">${gm(r).map(x=>msgH(x,m,t!='f')).join('')||'<p class="c mu">No hay mensajes todavía.</p>'}</div>
<div style="height:96px"></div><div class="chatbar">${rq?`<div class="mu">Respondiendo a ${esc(usr(rq.by).nick)} <span onclick="rep=null;render()">{{x}}</span></div>`:''}<div class="row"><button class="s sq" onclick="stkPick()">{{smile}}</button>${t=='g'?`<label class="cb sq">{{image}}<input type="file" accept="image/*" onchange="img(this.files[0],600,d=>send({img:d}))"></label>`:''}<input id="ct" placeholder="${t=='f'?'Escribe un mensaje...':'Mensaje... (@nick para mencionar)'}" style="margin:0" onkeydown="if(event.key=='Enter')send()"><button onclick="send()">{{send}}</button></div></div>`}
function send(o){o=o||{};load();const m=me(),t=o.stk?'':($('ct')?$('ct').value.trim():'');if(!t&&!o.stk&&!o.img)return;const now=Date.now(),sp=S.spam[m.id]||(S.spam[m.id]={n:0,l:'',lv:0,until:0});
if(!m.founder){if(sp.until>now)return toast('Silenciado '+Math.ceil((sp.until-now)/60000)+' min más por spam.');
if(t&&!o.img){if(sp.l==t)sp.n++;else{sp.n=1;sp.l=t}
if(sp.n==2)toast('{{warn}} Aviso: no repitas el mismo mensaje.');
if(sp.n>=3){sp.lv++;const min=Math.min(60,5*Math.pow(2,sp.lv-1));sp.until=now+min*60000;sp.n=0;save();return toast('{{mute}} Silenciado '+min+' minutos por spam.')}}}
const r=tab=='gen'?'gen':room,x={id:uid(),by:m.id,t,rep,ts:now};if(o.stk)x.stk=o.stk;if(o.img){const pid=uid();S.photos.push({id:pid,by:m.id,src:o.img,desc:t,likes:[],com:[],ts:now});x.post=pid;x.t=''}
if(r=='gen')S.msgs.push(x);else{x.room=r;S.cm.push(x)}
